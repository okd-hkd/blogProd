
{% extends "base.html" %}
{% block body %}


{% load i18n %}

<div class="row container">
<div class="col-md-12">

    <h1>Contact</h1>


     <form contact-form method="POST" action="https://formspree.io/t.okada@oliver-f.net">
           {% csrf_token %}

            <div class="form-group">
              <label for="contact-name">Your email</label>
              <input type="email" name="email" placeholder="Your email" class="form-control" id="contact-name" >
            </div>

            <div class="form-group">
              <label for="contact-message">Your Message</label>
              <textarea class="form-control" name="message" id="contact-message" placeholder="Your Message"></textarea>
            </div>

            <button class="btn btn-outline-success" type="submit">Send</button>
        </form>



</div>
</div>


{% endblock %}
