{% load i18n %}
<nav class="navbar sticky-top navbar-expand-lg navbar-dark bg-dark my-navbar">
    <a class="navbar-brand" href="http://okd-blog.net/">{% trans "岡田のブログ" %}</a>

    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="https://okd-blog.net/posts/">Blog<span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="{% url 'posts:email' %}">Contact</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="https://github.com/okadateru">Github</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="https://okd-blog.net/latest/feed/">RSS</a>
            </li>
        </ul>


        <!-- Dropdown menu for i18n-->
        <form action="{% url 'set_language' %}" method="post" style="background-color: #4CAF50; border-radius: 8px;opacity: .9;">{% csrf_token %}
            <input name="next" type="hidden" value="{{ redirect_to }}">
            <select name="language" style="background-color: #4CAF50;color: white; border: none;opacity: 1;">
                {% get_current_language as LANGUAGE_CODE %}
                {% get_available_languages as LANGUAGES %}
                {% get_language_info_list for LANGUAGES as languages %}
                {% for language in languages %}
            <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                    {{ language.name_local }}
                </option>
                {% endfor %}
            </select>
            <input type="submit" value="Go" style="background-color: #4CAF50;font-weight: bolder; color: white;opacity: 1;padding: 6px;border-radius: 8px;">
        </form>


    </div>


</nav>
